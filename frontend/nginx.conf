limit_req_zone $binary_remote_addr zone=api_clients:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=ai_clients:10m rate=2r/m;
limit_req_zone $server_name zone=ai_global:1m rate=12r/m;

map $http_x_forwarded_proto $upstream_scheme {
    default $scheme;
    https https;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    set_real_ip_from 172.16.0.0/12;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;
    limit_req_status 429;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $upstream_scheme;

    location ~ ^/api/v1/events/[0-9]+/analyze$ {
        limit_req zone=ai_clients burst=1 nodelay;
        limit_req zone=ai_global burst=2 nodelay;
        proxy_pass http://backend:8000;
    }

    location /api/ {
        limit_req zone=api_clients burst=40 nodelay;
        proxy_pass http://backend:8000;
    }

    location / {
        try_files $uri /index.html;
    }
}
